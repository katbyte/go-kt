name: workflow security audit

# Audits .github/workflows/ and the dependabot config with zizmor (values pasted into scripts,
# credentials a checkout leaves behind, permissions wider than a job needs, dangerous triggers).
# make downloads zizmor at the version pinned in the makefile (dependabot cannot bump it, so the
# pin lives there).
#
# This complements actionlint: actionlint covers syntax, expressions and shell, zizmor covers the
# security patterns actionlint does not.

permissions:
  contents: read

on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'makefile'

concurrency:
  group: 'workflow-zizmor-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  workflow-zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor on workflow files (downloads the pinned zizmor first)
        run: make zizmor
