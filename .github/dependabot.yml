---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # a release is left a week before it is taken, so one pulled for being bad never arrives
    cooldown:
      default-days: 7
    groups:
      # init and analyze must run the same version (analyze refuses a config written by another
      # release), so they have to move together in one PR
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # this is a library, so nothing is vendored; dependabot runs `go mod tidy` on updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # dev tools (actionlint, golangci-lint, gofumpt) pinned in .tools/go.mod; tools move slowly,
  # so only check quarterly
  - package-ecosystem: "gomod"
    directory: "/.tools"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
